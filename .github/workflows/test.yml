name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default token: this workflow only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning so unused imports / dead code can't slip in.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check repository CI policy
      run: |
        python3 -m unittest discover -s scripts -p 'test_*_policy.py'
        ./scripts/test_test_all.sh

    - name: Check mutation-wrapper command construction
      run: |
        ./scripts/test_run_mutants.sh

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcapstone-dev gcc-aarch64-linux-gnu z3 libz3-dev
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/local/bin

    - name: Check mutation-test wrapper invocations
      run: ./scripts/test_mutants_invocation.sh

    - name: Setup Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests (lib + bins)
      run: cargo test --lib --bins --verbose

    - name: Check s11 binary exists
      run: |
        echo "Checking if s11 binary was built..."
        ls -la target/debug/s11 || echo "s11 binary not found!"

    - name: Build test binaries
      run: |
        echo "Building test binaries..."
        ./build_tests.sh
        echo "Checking binaries directory:"
        ls -la binaries/ || echo "binaries/ directory not found"

    - name: Debug environment
      run: |
        echo "Current directory: $(pwd)"
        echo "Architecture: $(uname -m)"
        echo "Checking if we can run AArch64 binaries:"
        file binaries/simple_debug || echo "simple_debug not found"

    - name: Run integration tests with debug output
      run: |
        export RUST_BACKTRACE=1
        cargo test --test integration_tests -- --nocapture

    - name: Run all tests
      run: ./test_all.sh
