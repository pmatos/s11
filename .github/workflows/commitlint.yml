# Lints commit messages against Conventional Commits on pushes to the default branch.
# Direct pushes are what the PR-title check can't see; PRs are covered by lint-pr-title.yml.
name: Lint commits

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      # Tag-pinned, not hash-pinned: this repo's policy is tag pins kept current by
      # Dependabot rather than SHA pins.
      - uses: actions/checkout@v7.0.0 # zizmor: ignore[unpinned-uses]
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0 # zizmor: ignore[unpinned-uses]
        with:
          node-version: lts/*
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2 # zizmor: ignore[adhoc-packages]
      - name: Lint pushed commits
        if: github.event.before != '0000000000000000000000000000000000000000'
        env:
          AFTER_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "::notice title=Commitlint skipped::Before commit ${BEFORE_SHA} is unavailable (possibly after a force-push); no reliable pushed range can be constructed."
            exit 0
          fi
          npx commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose
