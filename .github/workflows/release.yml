name: Release

# Releases are cut by semantic-release on a weekly batch schedule (Sundays
# 00:00 UTC): it derives the next version from Conventional Commit types
# accumulated on main since the last release, builds the Linux `s11`
# binary, and publishes a GitHub Release (notes + CHANGELOG + tarball +
# checksums). No-op if nothing releasable landed that week. Use
# workflow_dispatch to cut a release on demand between scheduled runs.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  TARGET: x86_64-unknown-linux-gnu

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system build deps
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross is a Recommends (not a hard Depends) of
          # gcc-aarch64-linux-gnu, so --no-install-recommends silently drops
          # it — but it ships the crt objects (Scrt1.o, crti.o) build_tests.sh
          # needs to link the AArch64 test binaries. List it explicitly.
          sudo apt-get install -y --no-install-recommends \
            libcapstone-dev gcc-aarch64-linux-gnu libc6-dev-arm64-cross z3 libz3-dev
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --to /usr/local/bin
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # Inline npm dependencies are outside GitHub Actions Dependabot;
          # keep exact patch versions and update them deliberately.
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifacts (for debugging / reruns)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-upload-${{ github.sha }}
          path: release-upload/
          if-no-files-found: warn
          retention-days: 14
