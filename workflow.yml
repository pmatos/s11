workflow:
  name: vow_plan_tdd_pr
  initial: build_pr

  use:
    build_pr:
      template: builtin:plan-tdd-pr
      with:
        plan_prompt: prompts/plan.md
        impl_prompt: prompts/impl.md
      exits:
        success: code_review_fix
        blocked: failed

  states:
    code_review_fix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/code-review-fix.md
      transitions:
        - to: simplify
          when:
            provider_success: true
        - to: failed

    simplify:
      action:
        kind: agent
        provider: claude
        prompt: prompts/simplify.md
      transitions:
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    wait_for_pr:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: merge
          when:
            checks: success
            mergeable: true
            unresolved_review_threads: 0
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure
        - to: code_review_fix
          when:
            has_unresolved_reviews: true

    autofix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/autofix-pr.md
      transitions:
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    resolve_conflicts:
      action:
        kind: agent
        provider: claude
        prompt: prompts/resolve-conflicts.md
      transitions:
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    merge:
      action:
        kind: merge_pr
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure

    merged:
      terminal: success

    failed:
      terminal: blocked
