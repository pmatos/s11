workflow:
  name: vow_plan_tdd_pr
  initial: plan

  states:
    # Inlined from builtin:plan-tdd-pr because `with:` overrides template
    # inputs, not transitions, and this pipeline needs stricter gates than the
    # template's on both stages. The template's planning gate is
    # `provider_success` + `artifact_exists` and its implementing gate is
    # `branch_ahead_of_base` alone; both are reproduced below with an added
    # per-attempt progress requirement. Mirrors vow's workflow.yml.
    plan:
      action:
        kind: agent
        provider: claude
        prompt: prompts/plan.md
      transitions:
        # artifact_exists probes the Run Workspace for PLAN.md's presence —
        # it does not prevent the planner from also committing unrelated
        # files alongside it; "leave every other file untouched" is
        # enforced by prompts/plan.md, not by this gate. Nor does either
        # predicate confirm PLAN.md itself was committed: a PLAN.md written
        # but left uncommitted, paired with any unrelated commit, also
        # satisfies both conditions below. Symphonika (the orchestrator
        # running this workflow) has no "file committed" predicate, so this
        # residual gap is accepted and relies on prompts/plan.md's Exit
        # instructions.
        # branch_advanced_since_attempt_start is false unless this run added a
        # commit, so a resumed attempt cannot advance without running the
        # planner and committing again. It proves this run executed the
        # planning stage and committed, not that the plan content was
        # reconsidered or changed: prompts/plan.md always commits with
        # `--allow-empty`, so a resumed attempt with a byte-identical plan
        # still satisfies this gate, and Symphonika's predicate set has no
        # way to inspect commit content to tell the two cases apart. This
        # repo squash-merges (GitHub repo settings: allow_merge_commit=false),
        # so the throwaway PLAN.md commit that prompts/plan.md now requires
        # never reaches main — mirrors vow's workflow.yml.
        - to: implement
          when:
            provider_success: true
            artifact_exists: PLAN.md
            branch_advanced_since_attempt_start: true
        - to: failed

    implement:
      action:
        kind: agent
        provider: claude
        prompt: prompts/impl.md
      transitions:
        # branch_ahead_of_base alone would be satisfied by the plan commit
        # already on the branch, so require this run to advance HEAD too.
        # That still leaves a residual gap: prompts/impl.md's mandatory
        # "chore: drop stage-handoff PLAN.md" commit can itself satisfy
        # branch_advanced_since_attempt_start for an attempt that did no
        # real implementation work. prompts/impl.md's "never as the only
        # commit of this attempt" caveat mitigates this at the prompt level,
        # but Symphonika's fixed predicate set has no way to distinguish a
        # housekeeping commit from a substantive one, so this gate cannot
        # enforce it at the FSM level — same residual-gap class as the plan
        # stage's gate above.
        # This only proves local git state -- it cannot prove the branch
        # reached origin or that a pull request exists (issue #730 /
        # symphonika ADR-2026-09-10-1630) -- so hand off to a wait state
        # that confirms a tracked, open PR before code_review_fix runs,
        # instead of assuming impl.md's own push + gh pr create happened.
        - to: wait_for_pr_open
          when:
            provider_success: true
            branch_ahead_of_base: true
            branch_advanced_since_attempt_start: true
        - to: failed

    wait_for_pr_open:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: code_review_fix
          when:
            pr_open: true

    # code_review_fix, simplify, autofix, and resolve_conflicts gate on
    # provider_success alone, unlike plan/implement's added branch_advanced
    # check: these stages can legitimately finish with nothing to change (no
    # review comments, nothing to simplify, no conflicts) and must not be
    # forced to fabricate a commit just to advance.
    code_review_fix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/code-review-fix.md
      transitions:
        # A blocked pass writes BLOCKED.md instead of relying on a non-zero
        # exit code -- exiting non-zero from a Bash tool call only ends that
        # subshell, not the provider session, so provider_success reads true
        # regardless (issue #730). Ordered before the success transition.
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: simplify
          when:
            provider_success: true
        - to: failed

    simplify:
      action:
        kind: agent
        provider: claude
        prompt: prompts/simplify.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    wait_for_pr:
      action:
        kind: wait
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: merge
          when:
            checks: success
            mergeable: true
            unresolved_review_threads: 0
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure
        # Reviewer feedback on an otherwise-green PR. Ordered last so a clean
        # PR still merges and a broken one still repairs first. Without this
        # the state parks forever on the common shape -- green checks, one
        # unresolved thread -- because `merge` needs
        # unresolved_review_threads: 0 and `autofix` needs failing checks.
        # The orchestrator-wide review_followup loop no longer dispatches
        # alongside a parked raw-FSM run (issue #616), so a case this state
        # does not name is a case nothing handles.
        - to: autofix
          when:
            has_unresolved_reviews: true

    autofix:
      action:
        kind: agent
        provider: claude
        prompt: prompts/autofix-pr.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    resolve_conflicts:
      action:
        kind: agent
        provider: claude
        prompt: prompts/resolve-conflicts.md
      transitions:
        - to: failed
          when:
            artifact_exists: BLOCKED.md
        - to: wait_for_pr
          when:
            provider_success: true
        - to: failed

    merge:
      action:
        kind: merge_pr
      transitions:
        - to: merged
          when:
            pr_merged: true
        - to: failed
          when:
            pr_open: false
        - to: resolve_conflicts
          when:
            mergeable: false
        - to: autofix
          when:
            checks: failure

    merged:
      terminal: success

    failed:
      terminal: blocked
